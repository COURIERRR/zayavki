<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заявки с точек — Alina Group</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fd0">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заявки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Заявки с точек — оформление. Палитра та же, что у «Заявок на дизайн». */

:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #e2e7ee;
  --border-strong: #c6d0de;
  --text: #1c2430;
  --text-2: #4a5a70;
  --muted: #63707f;
  --accent: #1f5fd0;
  --accent-dark: #164aa8;
  --accent-bg: #e8f1fd;
  --on-accent: #ffffff;
  --critical: #c62b34;
  --critical-bg: #fdeced;
  --warn: #b46b00;
  --warn-bg: #fff5e4;
  --ok: #1a7f4b;
  --ok-bg: #eaf7f0;
  --r-design_ads: #6b3fd1;
  --r-design_ads-bg: #f1ecfd;
  --r-design: #1f5fd0;
  --r-design-bg: #e8f1fd;
  --r-ads: #b46b00;
  --r-ads-bg: #fff5e4;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 14px rgba(20, 30, 50, .06);
  --radius: 14px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151b;
    --surface: #1a2029;
    --surface-2: #212833;
    --border: #2c3542;
    --border-strong: #3e4a5a;
    --text: #e6ebf2;
    --text-2: #b4bfcd;
    --muted: #8a96a6;
    --accent: #5b93f0;
    --accent-dark: #7aa8f5;
    --accent-bg: #1c2b45;
    --critical: #ef6a72;
    --critical-bg: #3a1d21;
    --warn: #e6a43c;
    --warn-bg: #3a2c14;
    --ok: #4cc286;
    --ok-bg: #16322a;
    --r-design_ads: #a688f2;
    --r-design_ads-bg: #2a2242;
    --r-design: #5b93f0;
    --r-design-bg: #1c2b45;
    --r-ads: #e6a43c;
    --r-ads-bg: #3a2c14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  /* Логотип тёмно-синий — на тёмном фоне ему нужна светлая подложка. */
  .top-logo { background: #fff; border-radius: 6px; padding: 2px 5px; box-sizing: content-box; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 120px; }

/* Шапка */
.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  /* В приложении с экрана «Домой» страница заходит под вырез iPhone. */
  padding-top: env(safe-area-inset-top);
}
.install { border-color: var(--accent); }
.install p { margin: 6px 0 12px; font-size: 14px; color: var(--text-2); }
.top-in {
  max-width: 560px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.top-logo { height: 26px; width: auto; display: block; }
.top-title { flex: 1; font-weight: 650; font-size: 15px; line-height: 1.2; min-width: 0; }
.top-title small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.lang {
  display: flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden;
}
.lang button {
  border: 0; background: transparent; padding: 5px 10px; font-size: 13px; font-weight: 600;
  color: var(--muted);
}
.lang button.on { background: var(--accent); color: var(--on-accent); }

h1 { font-size: 22px; margin: 22px 0 6px; line-height: 1.25; }
h2 { font-size: 18px; margin: 20px 0 8px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }

/* Кнопки */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border-strong); background: var(--surface);
  border-radius: 12px; padding: 12px 16px; font-weight: 600; min-height: 48px;
  text-decoration: none; color: var(--text);
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--critical); border-color: var(--critical); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }

/* Главный экран */
.hero {
  display: block; width: 100%; text-align: left; border: 0;
  background: var(--accent); color: var(--on-accent);
  border-radius: 18px; padding: 22px 20px; margin: 8px 0 12px;
  box-shadow: var(--shadow);
}
.hero b { display: block; font-size: 22px; margin-bottom: 4px; }
.hero span { opacity: .9; font-size: 14px; }
.hero .ico { font-size: 34px; float: right; line-height: 1; }
.tile {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.tile .ico { font-size: 26px; }
.tile b { display: block; }
.tile span { color: var(--muted); font-size: 13px; }
.tile .count {
  margin-left: auto; background: var(--accent-bg); color: var(--accent);
  border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 14px;
}
.who { color: var(--muted); font-size: 14px; margin-top: 18px; text-align: center; }
.who button { border: 0; background: none; color: var(--accent); padding: 4px; }

/* Карточки и поля */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.field { margin-bottom: 14px; }
.field label, .field .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.field .req { color: var(--critical); }
.inp {
  width: 100%; border: 1px solid var(--border-strong); background: var(--surface);
  border-radius: 10px; padding: 11px 12px; min-height: 46px; font-size: 16px;
}
textarea.inp { min-height: 84px; resize: vertical; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.inp.bad { border-color: var(--critical); background: var(--critical-bg); }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; font-weight: 500;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips.bad .chip { border-color: var(--critical); }
.seg { display: flex; gap: 6px; }
.seg .chip { flex: 1; text-align: center; padding: 10px 6px; }

/* Мастер */
.steps { display: flex; gap: 4px; margin: 14px 0 4px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
.steps i.on { background: var(--accent); }
.step-name { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.nav-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.nav-in .btn { flex: 1; }
.nav-in .btn.primary { flex: 2; }

/* Чат помощника */
.chat { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.msg {
  max-width: 86%; padding: 10px 13px; border-radius: 16px; font-size: 15px;
  white-space: pre-wrap; word-wrap: break-word;
}
.msg.model { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.err { align-self: stretch; max-width: none; background: var(--critical-bg); color: var(--critical); font-size: 14px; }
.msg.wait { color: var(--muted); font-style: italic; }
.msg.wait::after { content: ''; display: inline-block; width: 1em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

.mic-box { text-align: center; margin: 18px 0 10px; }
.mic {
  width: 96px; height: 96px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--on-accent); font-size: 40px;
  box-shadow: 0 6px 20px rgba(31, 95, 208, .35);
}
.mic.rec { background: var(--critical); animation: pulse 1.2s ease-in-out infinite; }
.mic[disabled] { opacity: .45; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(198, 43, 52, .45); } 50% { box-shadow: 0 0 0 16px rgba(198, 43, 52, 0); } }
.mic-label { font-size: 14px; color: var(--muted); margin-top: 8px; min-height: 20px; }
.say-row { display: flex; gap: 8px; }
.say-row .inp { flex: 1; }
.say-row .btn { min-width: 52px; padding: 0 14px; }
.tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.toggle { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 6px 0; }

/* Маршрут */
.route {
  display: block; width: 100%; text-align: left; position: relative;
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px 14px 56px; margin-bottom: 10px;
}
.route .ico { position: absolute; left: 14px; top: 14px; font-size: 26px; }
.route b { display: block; font-size: 17px; }
.route span { color: var(--muted); font-size: 14px; }
.route.on { border-color: var(--accent); background: var(--accent-bg); }
.route .ai {
  display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600;
  background: var(--ok-bg); color: var(--ok); border-radius: 999px; padding: 2px 10px;
}
.reason { font-size: 14px; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }

/* Фото */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button {
  position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 16px; line-height: 1;
}
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; font-size: 200px; cursor: pointer; }

/* Маршрут-бейдж и списки */
.badge {
  display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 2px 9px;
}
.badge.design_ads { background: var(--r-design_ads-bg); color: var(--r-design_ads); }
.badge.design { background: var(--r-design-bg); color: var(--r-design); }
.badge.ads { background: var(--r-ads-bg); color: var(--r-ads); }
.badge.st-draft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.badge.st-ready { background: var(--accent-bg); color: var(--accent); }
.badge.st-sent { background: var(--ok-bg); color: var(--ok); }

.item {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 14px; margin-bottom: 8px; box-shadow: var(--shadow);
}
.item-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.item b { display: block; margin: 4px 0 2px; font-size: 15px; }
.item .meta { font-size: 13px; color: var(--text-2); }
.item .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.storage { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0 8px; }

/* Итог */
.sum-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sum-num { font-size: 20px; font-weight: 750; }
.sum dl { margin: 12px 0 0; }
.sum dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 10px; }
.sum dd { margin: 2px 0 0; white-space: pre-wrap; }
.sum .photos { margin-top: 12px; }

.note { font-size: 14px; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.ok { background: var(--ok-bg); color: var(--ok); }
.note.err { background: var(--critical-bg); color: var(--critical); }
.link-btn { border: 0; background: none; color: var(--accent); text-decoration: underline; padding: 6px 0; font-size: 14px; }

/* Всплывающее окно */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 15, 25, .5);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 18px 18px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 90vh; overflow: auto;
}
@media (min-width: 600px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: 18px; }
}
.modal h2 { margin-top: 0; }
.modal .btn { margin-top: 8px; }
.share-app { justify-content: flex-start; }

.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  max-width: calc(100% - 32px);
}
.busy {
  position: fixed; inset: 0; z-index: 70; background: rgba(10, 15, 25, .35);
  display: flex; align-items: center; justify-content: center;
}
.busy div { background: var(--surface); padding: 16px 22px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); }

</style>
</head>

    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsArrayBuffer(blob);
    });
  }

  var urlCache = {};
  function photoUrl(p) {
    if (!urlCache[p.id]) urlCache[p.id] = URL.createObjectURL(new Blob([p.buf], {type: p.type}));
    return urlCache[p.id];
  }
  function dropUrls() {
    Object.keys(urlCache).forEach(function (k) { URL.revokeObjectURL(urlCache[k]); });
    urlCache = {};
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function busy(msg) {
    var el = document.getElementById('busy');
    if (msg) { el.firstChild.textContent = msg; el.hidden = false; } else { el.hidden = true; }
  }

  function modal(html) {
    var bg = document.getElementById('modal');
    if (!html) { bg.hidden = true; bg.innerHTML = ''; return; }
    bg.innerHTML = '<div class="modal">' + html + '</div>';
    bg.hidden = false;
  }
  var askResolve = null;
  function ask(text, okLabel) {
    return new Promise(function (resolve) {
      askResolve = resolve;
      modal('<p style="margin-top:0">' + esc(text) + '</p>' +
        '<button class="btn block danger" data-act="ask-yes">' + esc(okLabel || t('yes')) + '</button>' +
        '<button class="btn block" data-act="ask-no">' + esc(t('cancel')) + '</button>');
    });
  }

  function routeName(r, dict) { return r ? (dict || T[S.lang])['r_' + r] || '' : ''; }

  // -------------------------------------------------------------------------
  // Отрисовка
  // -------------------------------------------------------------------------
  var app;

  function header() {
    return '<header class="top"><div class="top-in">' +
      '<img class="top-logo" src="' + LOGO + '" alt="Alina Group">' +
      '<div class="top-title">' + esc(t('appTitle')) + '<small>' + esc(t('appSub')) + '</small></div>' +
      '<div class="lang">' +
      '<button data-act="lang" data-l="ru" class="' + (S.lang === 'ru' ? 'on' : '') + '">RU</button>' +
      '<button data-act="lang" data-l="kk" class="' + (S.lang === 'kk' ? 'on' : '') + '">ҚАЗ</button>' +
      '</div></div></header>';
  }

  function render() {
    stopSpeaking();
    var html = header() + '<main class="wrap">';
    if (S.screen === 'profile') html += viewProfile();
    else if (S.screen === 'list') html += viewList();
    else if (S.screen === 'wizard' && S.cur) html += viewWizard();
    else html += viewHome();
    html += '</main>';
    if (S.screen === 'wizard' && S.cur) html += viewNav();
    app.innerHTML = html;
    if (S.screen === 'wizard' && S.cur && S.cur.step === 0) scrollChat();
    if (S.screen === 'list') showStorage();
    window.scrollTo(0, 0);
  }

  function viewHome() {
    var drafts = S.list.filter(function (r) { return r.status === 'draft'; });
    var p = S.profile || {};
    var h = '<h1>' + esc(t('hello')) + (p.name ? ', ' + esc(p.name) : '') + '!</h1>';
    if (!persistent) h += '<div class="note warn">' + esc(t('noStorage')) + '</div>';
    if (!IN_GAS && !/^https?:|^\//.test(window.ZT_API || '')) {
      h += '<div class="note err">Не задан адрес сервера: впишите ссылку …/exec в config.js</div>';
    }
    if (!IN_GAS && !isStandalone() && lsGet('zt_install_hidden') !== '1' && (installEvent || IS_IOS)) {
      h += '<div class="card install"><b>📲 ' + esc(t('installTitle')) + '</b><p>' +
        esc(IS_IOS && !installEvent ? t('installIos') : t('installAndroid')) + '</p><div class="btn-row">' +
        (installEvent ? '<button class="btn primary" data-act="install">' + esc(t('installBtn')) + '</button>' : '') +
        '<button class="btn" data-act="install-hide">' + esc(t('hide')) + '</button></div></div>';
    }
    h += '<button class="hero" data-act="new"><span class="ico">🎙</span><b>' + esc(t('newReq')) +
      '</b><span>' + esc(t('newReqHint')) + '</span></button>';
    if (drafts.length) {
      var d = drafts[0];
      h += '<button class="tile" data-act="open" data-id="' + esc(d.id) + '"><span class="ico">📝</span><div><b>' +
        esc(t('continueDraft')) + '</b><span>' + esc(d.fields.title || d.fields.point || fmtDate(d.updatedAt)) +
        '</span></div></button>';
    }
    h += '<button class="tile" data-act="list"><span class="ico">📂</span><div><b>' + esc(t('myReqs')) +
      '</b><span>' + esc(t('myReqsHint')) + '</span></div><span class="count">' + S.list.length + '</span></button>';
    if (p.name) {
      h += '<div class="who">' + esc(p.name) + (p.city ? ' · ' + esc(p.city) : '') +
        ' · <button data-act="profile">' + esc(t('editProfile')) + '</button></div>';
    }
    return h;
  }

  function cityOptions(sel) {
    var h = '<option value="">' + esc(t('choose')) + '</option>';
    var found = false;
    CFG.cities.forEach(function (c) {
      if (c === sel) found = true;
      h += '<option' + (c === sel ? ' selected' : '') + '>' + esc(c) + '</option>';
    });
    if (sel && !found) h += '<option selected>' + esc(sel) + '</option>';
    return h;
  }

  function viewProfile() {
    var p = S.profile || {};
    return '<h1>' + esc(t('profileTitle')) + '</h1><p class="sub">' + esc(t('profileHint')) + '</p>' +
      '<div class="card">' +
      '<div class="field"><label for="p-name">' + esc(t('name')) + ' <span class="req">*</span></label>' +
      '<input class="inp" id="p-name" autocomplete="name" value="' + esc(p.name || '') + '"></div>' +
      '<div class="field"><label for="p-phone">' + esc(t('phone')) + '</label>' +
      '<input class="inp" id="p-phone" type="tel" autocomplete="tel" placeholder="+7" value="' + esc(p.phone || '') + '"></div>' +
      '<div class="field"><label for="p-city">' + esc(t('city')) + '</label>' +
      '<select class="inp" id="p-city">' + cityOptions(p.city || '') + '</select></div>' +
      '<button class="btn primary block" data-act="profile-save">' + esc(t('save')) + '</button>' +
      '</div>' +
      (S.profile ? '<button class="btn ghost block" data-act="home">' + esc(t('back')) + '</button>' : '');
  }

  function itemHtml(r) {
    var f = r.fields || {};
    var place = [f.city, f.point].filter(Boolean).join(', ');
    return '<button class="item" data-act="open" data-id="' + esc(r.id) + '">' +
      '<div class="item-top"><span>' + esc(r.number || t('st_draft')) + '</span><span>' + fmtDate(r.updatedAt) + '</span></div>' +
      '<b>' + esc(f.title || f.problem || t('noName')) + '</b>' +
      (place ? '<div class="meta">' + esc(place) + '</div>' : '') +
      '<div class="badges">' +
      (r.route ? '<span class="badge ' + r.route + '">' + esc(routeName(r.route)) + '</span>' : '') +
      '<span class="badge st-' + r.status + '">' + esc(t('st_' + r.status)) + '</span>' +
      (r.photos.length ? '<span class="badge st-draft">' + r.photos.length + ' ' + esc(t('photos')) + '</span>' : '') +
      '</div></button>';
  }

  function viewList() {
    var h = '<h1>' + esc(t('myReqs')) + '</h1>';
    if (!S.list.length) {
      h += '<div class="empty">📭<br>' + esc(t('empty')) + '</div>';
    } else {
      S.list.forEach(function (r) { h += itemHtml(r); });
    }
    h += '<div class="storage" id="storage"></div>';
    if (S.list.length) h += '<button class="btn danger block" data-act="clear">' + esc(t('clearAll')) + '</button>';
    h += '<button class="btn ghost block" data-act="home">' + esc(t('home')) + '</button>';
    return h;
  }

  function showStorage() {
    if (!navigator.storage || !navigator.storage.estimate) return;
    navigator.storage.estimate().then(function (e) {
      var el = document.getElementById('storage');
      if (el && e && e.usage !== undefined) {
        el.textContent = t('storageUsed') + ': ' + (e.usage / 1048576).toFixed(1) + ' МБ';
      }
    }).catch(function () {});
  }

  // --- Мастер ---------------------------------------------------------------

  function viewWizard() {
    var r = S.cur;
    var names = t('steps');
    var n = names.length;
    var h = '<div class="steps">';
    for (var i = 0; i < n; i++) h += '<i class="' + (i <= r.step ? 'on' : '') + '"></i>';
    h += '</div><div class="step-name">' + (r.step + 1) + ' / ' + n + ' · ' + esc(names[r.step]) + '</div>';
    if (r.step === 0) h += stepAssistant();
    else if (r.step === 1) h += stepPhotos();
    else if (r.step === 2) h += stepText();
    else h += stepSummary();
    return h;
  }

  // Последний ответ помощника — отказ (просили не баннер): дальше не пускаем,
  // пока человек не опишет баннер.
  function blocked(r) {
    return r.step === 0 && r.rejected && !r.aiDone;
  }

  function viewNav() {
    var r = S.cur;
    var left, right;
    if (r.step === STEP_SUMMARY) {
      left = '<button class="btn" data-act="go" data-s="2">' + esc(t('edit')) + '</button>';
      right = '<button class="btn primary" data-act="finish">' + esc(t('done')) + '</button>';
    } else {
      left = '<button class="btn" data-act="prev">' + esc(t('back')) + '</button>';
      right = '<button class="btn primary" data-act="next" id="next-btn"' + (blocked(r) ? ' disabled' : '') + '>' +
        esc(r.step === 2 ? t('toSummary') : t('next')) + ' →</button>';
    }
    return '<nav class="nav"><div class="nav-in">' + left + right + '</div></nav>';
  }

  function micSupported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function chatHtml() {
    var h = '';
    S.cur.chat.forEach(function (m) {
      h += '<div class="msg ' + (m.role === 'model' ? 'model' : 'user') + '">' + esc(m.text) + '</div>';
    });
    if (S.busyAI) h += '<div class="msg model wait">' + esc(t('thinking')) + '</div>';
    if (S.chatError) h += '<div class="msg err">' + esc(S.chatError) + '</div>';
    if (blocked(S.cur) && !S.busyAI) h += '<div class="note err">⛔ ' + esc(t('rejectedNote')) + '</div>';
    else if (S.cur.aiDone && !S.busyAI) h += '<div class="note ok">✅ ' + esc(t('aiDone')) + '</div>';
    return h;
  }

  function stepAssistant() {
    var h = '<h1>' + esc(t('newReq')) + '</h1><p class="sub">' + esc(t('bannersOnly')) + '</p>';
    if (!S.aiReady) {
      return h + '<div class="note warn">' + esc(t('aiOff')) + '</div>';
    }
    h += '<div class="chat" id="chat">' + chatHtml() + '</div>';
    var canMic = micSupported() && !S.micFailed;
    if (canMic) {
      h += '<div class="mic-box"><button class="mic" id="mic" data-act="mic"' + (S.busyAI ? ' disabled' : '') +
        '>🎙</button><div class="mic-label" id="mic-label">' + esc(t('micStart')) + '</div></div>';
    } else if (!IS_IOS) {
      // Android открывает по этой кнопке диктофон. iPhone вместо него
      // открывает видеокамеру, поэтому там — только диктовка с клавиатуры.
      h += '<div class="mic-box"><label class="btn primary file-btn">' + esc(t('recordFile')) +
        '<input type="file" accept="audio/*" capture data-change="audio"></label></div>';
    }
    h += '<div class="say-row"><input class="inp" id="say" enterkeyhint="send" placeholder="' + esc(t('typeHere')) + '">' +
      '<button class="btn primary" data-act="say" aria-label="send">➤</button></div>' +
      '<div class="tools"><button class="toggle" data-act="voice">' + esc(S.voice ? t('voiceOn') : t('voiceOff')) + '</button>' +
      '<button class="link-btn" data-act="manual" id="manual-btn"' + (blocked(S.cur) ? ' hidden' : '') + '>' +
      esc(t('manual')) + ' →</button></div>';
    return h;
  }

  function renderChat() {
    var el = document.getElementById('chat');
    if (!el) return;
    el.innerHTML = chatHtml();
    var mic = document.getElementById('mic');
    if (mic) mic.disabled = S.busyAI;
    var nextBtn = document.getElementById('next-btn');
    if (nextBtn) nextBtn.disabled = blocked(S.cur);
    var manual = document.getElementById('manual-btn');
    if (manual) manual.hidden = blocked(S.cur);
    scrollChat();
  }
  function scrollChat() {
    var el = document.getElementById('chat');
    if (el && el.lastElementChild) el.lastElementChild.scrollIntoView({block: 'nearest'});
  }

  function stepPhotos() {
    var r = S.cur;
    var h = '<h1>' + esc(t('photosTitle')) + '</h1><p class="sub">' + esc(t('photosHint')) + '</p>';
    var full = r.photos.length >= MAX_PHOTOS;
    h += '<div class="btn-row">' +
      '<label class="btn primary file-btn"' + (full ? ' disabled' : '') + '>' + esc(t('takePhoto')) +
      '<input type="file" accept="image/*" capture="environment" data-change="photo"></label>' +
      '<label class="btn file-btn"' + (full ? ' disabled' : '') + '>' + esc(t('fromGallery')) +
      '<input type="file" accept="image/*" multiple data-change="photo"></label></div>';
    h += '<div class="photos">';
    r.photos.forEach(function (p) {
      h += '<div class="ph"><img src="' + photoUrl(p) + '" alt=""><button data-act="photo-del" data-id="' + p.id + '">✕</button></div>';
    });
    h += '</div><div class="hint">' + r.photos.length + ' / ' + MAX_PHOTOS + '</div>';
    return h;
  }

  function hasDesign(route) { return route === 'design' || route === 'design_ads'; }

  function fieldInput(key, opts) {
    opts = opts || {};
    var v = S.cur.fields[key] || '';
    var label = '<label for="f-' + key + '">' + esc(t('f_' + key)) + (opts.req ? ' <span class="req">*</span>' : '') + '</label>';
    var ph = opts.ph ? ' placeholder="' + esc(t(opts.ph)) + '"' : '';
    var ctl = opts.area
      ? '<textarea class="inp" id="f-' + key + '" data-f="' + key + '"' + ph + '>' + esc(v) + '</textarea>'
      : '<input class="inp" id="f-' + key + '" data-f="' + key + '"' + ph + ' value="' + esc(v) + '">';
    return '<div class="field">' + label + ctl + '</div>';
  }

  function stepText() {
    var r = S.cur;
    var f = r.fields;
    var h = '<h1>' + esc(t('textTitle')) + '</h1><p class="sub">' + esc(t('textHint')) + '</p>';
    h += '<div class="card">' + fieldInput('title', {req: true});
    h += '<div class="field"><label for="f-city">' + esc(t('city')) + ' <span class="req">*</span></label>' +
      '<select class="inp" id="f-city" data-f="city">' + cityOptions(f.city || '') + '</select></div>';
    h += fieldInput('point', {req: true, ph: 'f_pointPh'});
    h += fieldInput('problem', {req: true, area: true});
    h += fieldInput('todo', {area: true});
    h += '</div><div class="card">';

    h += '<div class="field"><span class="lbl">' + esc(t('f_kind')) + '</span>' +
      '<div class="chips"><span class="chip on">' + esc(BANNER) + '</span></div></div>';

    var brands = f.brands || [];
    h += '<div class="field"><span class="lbl">' + esc(t('f_brands')) + ' <span class="req">*</span></span><div class="chips" id="brands">';
    CFG.brands.forEach(function (b) {
      h += '<button class="chip' + (brands.indexOf(b) >= 0 ? ' on' : '') + '" data-act="brand" data-b="' + esc(b) + '">' + esc(b) + '</button>';
    });
    h += '<button class="chip' + (f.noBrand ? ' on' : '') + '" data-act="nobrand">' + esc(t('noBrand')) + '</button></div></div>';

    h += '<div class="field"><span class="lbl">' + esc(t('f_urgency')) + '</span><div class="seg">';
    URGENCY.forEach(function (u) {
      h += '<button class="chip' + ((f.urgency || 'normal') === u ? ' on' : '') + '" data-act="urg" data-u="' + u + '">' + esc(t('u_' + u)) + '</button>';
    });
    h += '</div></div>';
    h += fieldInput('size', {ph: 'f_sizePh'});
    if (hasDesign(r.route)) {
      h += fieldInput('layoutText', {area: true, ph: 'f_layoutPh'});
      h += fieldInput('designWishes', {area: true, ph: 'f_wishesPh'});
    }
    h += '</div><div class="card">';
    h += '<div class="field"><label for="a-name">' + esc(t('name')) + '</label>' +
      '<input class="inp" id="a-name" data-a="name" value="' + esc(r.author.name || '') + '"></div>';
    h += '<div class="field"><label for="a-phone">' + esc(t('phone')) + '</label>' +
      '<input class="inp" id="a-phone" type="tel" data-a="phone" value="' + esc(r.author.phone || '') + '"></div>';
    h += '</div>';
    return h;
  }

  function summaryRows(r, dict) {
    var f = r.fields;
    var rows = [
      ['r', 'Маршрут', routeName(r.route, dict)],
      ['u', dict.f_urgency, dict['u_' + (f.urgency || 'normal')]],
      ['c', dict.city, f.city],
      ['p', dict.f_point, f.point],
      ['t', dict.f_title, f.title],
      ['pr', dict.f_problem, f.problem],
      ['td', dict.f_todo, f.todo],
      ['k', dict.f_kind, f.kind],
      ['b', dict.f_brands, f.noBrand ? dict.noBrand : (f.brands || []).join(', ')],
      ['s', dict.f_size, f.size]
    ];
    if (hasDesign(r.route)) {
      rows.push(['lt', dict.f_layoutText, f.layoutText]);
      rows.push(['dw', dict.f_designWishes, f.designWishes]);
    }
    rows.push(['a', dict.author, [r.author.name, r.author.phone].filter(Boolean).join(', ')]);
    return rows.filter(function (x) { return x[2]; });
  }

  function stepSummary() {
    var r = S.cur;
    var h = '<h1>' + esc(t('summaryTitle')) + '</h1>';
    h += '<div class="card sum"><div class="sum-head"><div><div class="sum-num">' + esc(r.number || '…') + '</div>' +
      '<div class="hint">' + esc(t('submitted')) + ' ' + fmtDate(r.createdAt) + '</div></div>' +
      '<div><span class="badge ' + r.route + '">' + esc(routeName(r.route)) + '</span><br>' +
      '<span class="badge st-' + r.status + '" style="margin-top:6px">' + esc(t('st_' + r.status)) + '</span></div></div>';
    if (r.numberLocal) h += '<div class="note warn">' + esc(t('tempNumber')) + '</div>';
    h += '<dl>';
    var dict = T[S.lang];
    summaryRows(r, dict).forEach(function (row) {
      if (row[0] === 'r') return;
      h += '<dt>' + esc(row[1]) + '</dt><dd>' + esc(row[2]) + '</dd>';
    });
    h += '</dl>';
    if (r.photos.length) {
      h += '<div class="photos">';
      r.photos.forEach(function (p) { h += '<div class="ph"><img src="' + photoUrl(p) + '" alt=""></div>'; });
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="btn-row"><button class="btn primary" data-act="share">' + esc(t('share')) + '</button>' +
      '<button class="btn" data-act="download">' + esc(t('download')) + '</button></div>';
    if (S.lastDl) h += '<button class="link-btn" data-act="drive-dl">' + esc(t('viaDrive')) + '</button>';
    h += '<div style="text-align:center;margin-top:24px"><button class="link-btn" style="color:var(--critical)" data-act="del">' +
      esc(t('del')) + '</button></div>';
    return h;
  }

  // -------------------------------------------------------------------------
  // Заявки: создание, открытие, переходы
  // -------------------------------------------------------------------------
  function refreshList() {
    return dbAll('requests').then(function (all) {
      all.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      S.list = all;
    });
  }

  function newRequest() {
    if (!S.profile) { S.afterProfile = 'new'; S.screen = 'profile'; render(); return; }
    var now = Date.now();
    S.cur = {
      id: uid(), createdAt: now, updatedAt: now, status: 'draft', step: 0,
      number: '', route: ROUTE, aiDone: false, rejected: false,
      chat: [{role: 'model', text: t('greet'), local: true}],
      fields: {city: S.profile.city || '', kind: BANNER, urgency: 'normal', brands: [], noBrand: false},
      touched: {},
      author: {name: S.profile.name || '', phone: S.profile.phone || ''},
      photos: [], xlsx: null, xlsxAt: 0, driveId: '', driveAt: 0
    };
    S.chatError = '';
    S.micFailed = false;
    S.lastDl = false;
    S.screen = 'wizard';
    saveNow();
    render();
  }

  function openRequest(id) {
    dbGet('requests', id).then(function (r) {
      if (!r) return;
      S.cur = r;
      S.chatError = '';
      S.lastDl = false;
      if (r.status !== 'draft') r.step = STEP_SUMMARY;
      else if (r.step >= STEP_SUMMARY) r.step = STEP_SUMMARY - 1; // черновик из старой версии с 5 шагами
      S.screen = 'wizard';
      render();
      if (r.step === STEP_SUMMARY) prepareXlsx();
    });
  }

  function isEmptyDraft(r) {
    return r.status === 'draft' && !r.photos.length &&
      !r.chat.some(function (m) { return m.role === 'user'; }) &&
      !r.fields.title && !r.fields.point && !r.fields.problem;
  }

  function goHome() {
    stopRec(true);
    var r = S.cur;
    var p = Promise.resolve();
    if (r) p = isEmptyDraft(r) ? dbDel('requests', r.id) : saveNow();
    S.cur = null;
    dropUrls();
    return p.then(refreshList).then(function () { S.screen = 'home'; render(); });
  }

  function goStep(n) {
    stopRec(true);
    S.cur.step = n;
    saveNow();
    render();
  }

  function validateText() {
    var f = S.cur.fields;
    var bad = [];
    ['title', 'city', 'point', 'problem'].forEach(function (k) {
      if (!String(f[k] || '').trim()) bad.push('f-' + k);
    });
    var brandOk = f.noBrand || (f.brands && f.brands.length);
    bad.forEach(function (id) { document.getElementById(id).classList.add('bad'); });
    if (!brandOk) document.getElementById('brands').classList.add('bad');
    if (bad.length) {
      document.getElementById(bad[0]).scrollIntoView({block: 'center'});
      toast(t('required'));
      return false;
    }
    if (!brandOk) {
      document.getElementById('brands').scrollIntoView({block: 'center'});
      toast(t('needBrand'));
      return false;
    }
    return true;
  }

  function next() {
    var r = S.cur;
    if (blocked(r)) return;
    if (r.step === 1 && !r.photos.length) {
      ask(t('noPhotoConfirm'), t('next')).then(function (ok) { if (ok) goStep(2); });
      return;
    }
    if (r.step === 2) {
      if (!validateText()) return;
      toSummary();
      return;
    }
    goStep(r.step + 1);
  }

  function toSummary() {
    var r = S.cur;
    var p = Promise.resolve();
    if (!r.number) {
      busy(t('numbering'));
      p = server('nextNumber').then(function (res) {
        if (!res || !res.ok) throw new Error('no number');
        r.number = res.number;
      }).catch(function () {
        var d = new Date();
        r.number = 'ЗТ-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) +
          '-' + Math.random().toString(16).slice(2, 6).toUpperCase();
        r.numberLocal = true;
      });
    }
    p.then(function () {
      busy(null);
      if (r.status === 'draft') r.status = 'ready';
      S.lastDl = false;
      goStep(STEP_SUMMARY);
      prepareXlsx();
    });
  }

  // -------------------------------------------------------------------------
  // Голос: запись -> WAV 16 кГц -> сервер -> Gemini
  // -------------------------------------------------------------------------
  function pickMime() {
    var list = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'];
    for (var i = 0; i < list.length; i++) {
      try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) { /* старый браузер */ }
    }
    return '';
  }

  function updateMicUI() {
    var mic = document.getElementById('mic');
    var label = document.getElementById('mic-label');
    if (!mic || !label) return;
    if (S.rec) {
      var sec = Math.floor((Date.now() - S.rec.t0) / 1000);
      mic.classList.add('rec');
      mic.textContent = '⏹';
      label.textContent = t('micStop') + '  0:' + pad(sec);
      if (sec >= MAX_REC_SEC) stopRec();
    } else {
      mic.classList.remove('rec');
      mic.textContent = '🎙';
      label.textContent = S.busyAI ? t('micWait') : t('micStart');
    }
  }

  function toggleMic() {
    if (S.busyAI) return;
    if (S.rec) { stopRec(); return; }
    stopSpeaking();
    S.chatError = '';
    navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}})
      .then(function (stream) {
        var mime = pickMime();
        var mr = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
        var chunks = [];
        var rec = {mr: mr, stream: stream, t0: Date.now(), cancel: false};
        mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = function () {
          stream.getTracks().forEach(function (tr) { tr.stop(); });
          clearInterval(rec.timer);
          if (S.rec === rec) S.rec = null;
          updateMicUI();
          if (rec.cancel) return;
          if (Date.now() - rec.t0 < 800 || !chunks.length) { toast(t('tooShort')); return; }
          handleAudio(new Blob(chunks, {type: mr.mimeType || mime || 'audio/webm'}));
        };
        mr.start(1000);
        rec.timer = setInterval(updateMicUI, 250);
        S.rec = rec;
        updateMicUI();
      })
      .catch(function (e) {
        console.warn('mic', e);
        S.micFailed = true;
        S.chatError = e && e.name === 'NotAllowedError' && !IN_GAS ? t('micDenied')
          : t(IS_IOS ? 'micBlockedIos' : 'micBlocked');
        render();
      });
  }

  function stopRec(cancel) {
    var rec = S.rec;
    if (!rec) return;
    rec.cancel = !!cancel;
    try { rec.mr.stop(); } catch (e) { rec.stream.getTracks().forEach(function (tr) { tr.stop(); }); }
    S.rec = null;
  }

  function decodeAudio(ab) {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ac = new AC();
    return new Promise(function (resolve, reject) {
      var p = ac.decodeAudioData(ab, resolve, reject);
      if (p && p.then) p.then(resolve, reject);
    }).then(function (buf) {
      if (ac.close) ac.close();
      return buf;
    });
  }

  function resample(decoded) {
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var rate = 16000;
    var off;
    try {
      off = new OAC(1, Math.ceil(decoded.duration * rate), rate);
    } catch (e) {
      // Старый Safari не умеет частоту ниже 22 050 Гц.
      rate = 22050;
      off = new OAC(1, Math.ceil(decoded.duration * rate), rate);
    }
    var src = off.createBufferSource();
    src.buffer = decoded;
    src.connect(off.destination);
    src.start(0);
    return new Promise(function (resolve, reject) {
      off.oncomplete = function (e) { resolve(e.renderedBuffer); };
      var p = off.startRendering();
      if (p && p.then) p.then(resolve, reject);
    });
  }

  function encodeWav(buf) {
    var pcm = buf.getChannelData(0);
    var rate = buf.sampleRate;
    var out = new ArrayBuffer(44 + pcm.length * 2);
    var v = new DataView(out);
    var w = function (o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
    w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
    for (var i = 0, o = 44; i < pcm.length; i++, o += 2) {
      var s = Math.max(-1, Math.min(1, pcm[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return out;
  }

  function handleAudio(blob) {
    S.busyAI = true;
    renderChat();
    updateMicUI();
    blobToAB(blob)
      .then(function (ab) {
        return decodeAudio(ab.slice(0)).then(resample).then(function (buf) {
          return {b64: abToB64(encodeWav(buf)), mime: 'audio/wav'};
        }).catch(function (e) {
          // Не смогли разобрать сами — отдаём Gemini как есть.
          console.warn('decode', e);
          return {b64: abToB64(ab), mime: (blob.type || 'audio/mp4').split(';')[0]};
        });
      })
      .then(function (audio) { sendTurn(audio, ''); })
      .catch(function (e) {
        S.busyAI = false;
        S.chatError = String(e && e.message || e);
        renderChat();
        updateMicUI();
      });
  }

  function sendText() {
    var inp = document.getElementById('say');
    var text = inp ? inp.value.trim() : '';
    if (!text || S.busyAI) return;
    inp.value = '';
    stopSpeaking();
    sendTurn(null, text);
  }

  function sendTurn(audio, text) {
    var r = S.cur;
    var history = r.chat.filter(function (m) { return !m.local; })
      .map(function (m) { return {role: m.role, text: m.text}; });
    var userMsg = {role: 'user', text: audio ? t('voiceMsg') + '…' : text};
    r.chat.push(userMsg);
    S.busyAI = true;
    S.chatError = '';
    renderChat();
    updateMicUI();
    var known = {};
    Object.keys(r.fields).forEach(function (k) { if (k !== 'noBrand') known[k] = r.fields[k]; });
    if (r.route) known.route = r.route;
    server('assistantTurn', audio, text, {
      history: history, fields: known,
      profile: {city: S.profile && S.profile.city || ''}, uiLang: S.lang
    }).then(function (res) {
      S.busyAI = false;
      if (!res || !res.ok) {
        if (audio) r.chat.splice(r.chat.indexOf(userMsg), 1);
        S.chatError = res && res.error || t('errNet');
      } else {
        if (audio) userMsg.text = res.transcript ? '🎤 ' + res.transcript : t('voiceMsg');
        if (res.reply) r.chat.push({role: 'model', text: res.reply});
        // Отказ (просили не баннер): поля не трогаем, «Дальше» закрыт,
        // пока человек не опишет баннер.
        r.rejected = !!res.rejected;
        if (!r.rejected) applyAI(res.fields || {});
        if (res.done) r.aiDone = true;
        speak(res.reply, res.lang);
      }
      touch();
      renderChat();
      updateMicUI();
    }).catch(function (e) {
      console.warn('assistantTurn', e);
      S.busyAI = false;
      if (audio) r.chat.splice(r.chat.indexOf(userMsg), 1);
      S.chatError = t('errNet');
      touch();
      renderChat();
      updateMicUI();
    });
  }

  function applyAI(f) {
    var r = S.cur;
    FIELDS_FROM_AI.forEach(function (k) {
      if (r.touched[k]) return;
      var v = f[k];
      if (k === 'problem' && !v) v = f.description;
      if (v === undefined || v === null || v === '') return;
      if (k === 'brands') {
        if (!Array.isArray(v) || !v.length) return;
        v = v.filter(function (b) { return CFG.brands.indexOf(b) >= 0; });
        if (v.length) r.fields.noBrand = false;
      }
      if (k === 'urgency' && URGENCY.indexOf(v) < 0) return;
      r.fields[k] = v;
    });
  }

  function speak(text, lang) {
    if (!S.voice || !text || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    try {
      var want = lang === 'kk' ? /^kk/i : /^ru/i;
      var voices = speechSynthesis.getVoices() || [];
      var v = null;
      for (var i = 0; i < voices.length; i++) if (want.test(voices[i].lang)) { v = voices[i]; break; }
      // Русский голос, читающий казахский текст, звучит хуже тишины.
      if (!v && (lang === 'kk' || voices.length)) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = v ? v.lang : 'ru-RU';
      if (v) u.voice = v;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) { /* озвучка — не главное */ }
  }
  function stopSpeaking() {
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* нет так нет */ }
  }

  // -------------------------------------------------------------------------
  // Фото
  // -------------------------------------------------------------------------
  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve({img: img, url: url}); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  function compress(file) {
    return loadImage(file).then(function (o) {
      var w = o.img.naturalWidth, h = o.img.naturalHeight;
      var k = Math.min(1, PHOTO_PX / Math.max(w, h));
      var cw = Math.round(w * k), ch = Math.round(h * k);
      var c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      c.getContext('2d').drawImage(o.img, 0, 0, cw, ch);
      URL.revokeObjectURL(o.url);
      return new Promise(function (resolve) { c.toBlob(resolve, 'image/jpeg', 0.8); })
        .then(blobToAB)
        .then(function (buf) { return {id: uid(), buf: buf, type: 'image/jpeg', w: cw, h: ch}; });
    });
  }

  function addPhotos(files) {
    var r = S.cur;
    var room = MAX_PHOTOS - r.photos.length;
    var list = Array.prototype.slice.call(files, 0);
    if (list.length > room) toast(t('photoLimit'));
    list = list.slice(0, Math.max(0, room));
    if (!list.length) return;
    busy('…');
    var chain = Promise.resolve();
    list.forEach(function (f) {
      chain = chain.then(function () {
        return compress(f).then(function (p) { r.photos.push(p); }).catch(function () { toast(t('photoBad')); });
      });
    });
    chain.then(function () {
      busy(null);
      touch();
      render();
    });
  }

  // -------------------------------------------------------------------------
  // Excel
  // -------------------------------------------------------------------------
  var excelLoading = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve();
    if (excelLoading) return excelLoading;
    excelLoading = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = EXCELJS_URL;
      s.onload = function () { resolve(); };
      s.onerror = function () { excelLoading = null; reject(new Error('Не загрузилась библиотека Excel. Проверьте интернет.')); };
      document.head.appendChild(s);
    });
    return excelLoading;
  }

  function xlsxName(r) {
    var parts = ['Заявка', r.number, r.fields.city].filter(Boolean).join('_');
    return parts.replace(/[\\\/:*?"<>|\s]+/g, '_') + '.xlsx';
  }

  // Высоту строки Excel по тексту не подбирает (тем более в объединённых
  // ячейках), поэтому считаем строки сами: B:D вмещают около 60 символов.
  function rowHeight(text, perLine) {
    var lines = 0;
    String(text).split('\n').forEach(function (p) { lines += Math.max(1, Math.ceil(p.length / perLine)); });
    return Math.max(20, lines * 15 + 5);
  }

  function buildXlsx(r) {
    return loadExcelJS().then(function () {
      var wb = new ExcelJS.Workbook();
      wb.creator = 'Заявки с точек';
      wb.created = new Date(r.createdAt);
      var ws = wb.addWorksheet('Заявка', {
        views: [{showGridLines: false}],
        pageSetup: {paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
          margins: {left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3}}
      });
      ws.columns = [{width: 24}, {width: 22}, {width: 22}, {width: 22}];
      var border = {style: 'thin', color: {argb: 'FFD5DBE5'}};
      var box = {top: border, left: border, bottom: border, right: border};
      var routeFill = {design_ads: 'FFF1ECFD', design: 'FFE8F1FD', ads: 'FFFFF5E4'};

      ws.mergeCells('A1:C1');
      var c1 = ws.getCell('A1');
      c1.value = 'Заявка ' + r.number;
      c1.font = {size: 16, bold: true};
      c1.alignment = {vertical: 'middle'};
      ws.getRow(1).height = 40;
      var logoId = wb.addImage({base64: LOGO, extension: 'png'});
      ws.addImage(logoId, {tl: {col: 3.1, row: 0.12}, ext: {width: 105, height: 35}});

      ws.mergeCells('A2:D2');
      ws.getCell('A2').value = RU.submitted + ' ' + fmtDate(r.createdAt) + ' · Заявки с точек · Alina Group';
      ws.getCell('A2').font = {size: 10, color: {argb: 'FF63707F'}};

      var row = 4;
      summaryRows(r, RU).forEach(function (x) {
        ws.mergeCells('B' + row + ':D' + row);
        var a = ws.getCell('A' + row);
        var b = ws.getCell('B' + row);
        a.value = x[1];
        a.font = {bold: true, color: {argb: 'FF4A5A70'}};
        a.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFF2F4F7'}};
        a.alignment = {vertical: 'top', wrapText: true};
        b.value = x[2];
        b.alignment = {vertical: 'top', wrapText: true};
        if (x[0] === 'r') {
          b.font = {bold: true};
          b.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: routeFill[r.route] || 'FFFFFFFF'}};
        }
        if (x[0] === 'u' && r.fields.urgency === 'urgent') b.font = {bold: true, color: {argb: 'FFC62B34'}};
        ['A', 'B', 'C', 'D'].forEach(function (col) { ws.getCell(col + row).border = box; });
        ws.getRow(row).height = Math.max(rowHeight(x[2], 60), rowHeight(x[1], 22));
        row++;
      });

      if (r.photos.length) {
        row++;
        ws.getCell('A' + row).value = 'Фото точки (' + r.photos.length + ')';
        ws.getCell('A' + row).font = {bold: true, size: 12};
        row++;
        var ROW_PX = 20;
        for (var i = 0; i < r.photos.length; i += 2) {
          var pair = r.photos.slice(i, i + 2);
          var maxH = 0;
          pair.forEach(function (p, j) {
            var k = Math.min(300 / p.w, 240 / p.h);
            var w = Math.round(p.w * k), h = Math.round(p.h * k);
            maxH = Math.max(maxH, h);
            var id = wb.addImage({base64: 'data:image/jpeg;base64,' + abToB64(p.buf), extension: 'jpeg'});
            ws.addImage(id, {tl: {col: j * 2 + 0.05, row: row - 1 + 0.15}, ext: {width: w, height: h}});
          });
          var rows = Math.ceil((maxH + 12) / ROW_PX);
          for (var q = 0; q < rows; q++) ws.getRow(row + q).height = ROW_PX * 0.75;
          row += rows;
        }
      }

      var wd = wb.addWorksheet('Диалог с помощником');
      wd.columns = [{header: 'Кто', key: 'who', width: 14}, {header: 'Текст', key: 'text', width: 90}];
      wd.getRow(1).font = {bold: true};
      r.chat.forEach(function (m) {
        var added = wd.addRow({who: m.role === 'model' ? 'Помощник' : 'Подающий', text: m.text});
        added.alignment = {vertical: 'top', wrapText: true};
        added.height = rowHeight(m.text, 85);
      });

      return wb.xlsx.writeBuffer();
    }).then(toArrayBuffer);
  }

  function ensureXlsx(r) {
    if (r.xlsx && r.xlsxAt >= r.updatedAt) return Promise.resolve(r.xlsx);
    return buildXlsx(r).then(function (buf) {
      r.xlsx = buf;
      r.xlsxAt = Date.now();
      if (S.cur === r) saveNow(); else dbPut('requests', r);
      return buf;
    });
  }

  // Собираем файл заранее, пока человек читает итог: тогда «Отправить»
  // успевает вызвать меню телефона, пока браузер считает нажатие свежим.
  function prepareXlsx() {
    var r = S.cur;
    if (r) ensureXlsx(r).catch(function (e) { console.warn('xlsx', e); });
  }

  function ensureUploaded(r) {
    return ensureXlsx(r).then(function (buf) {
      if (r.driveId && r.driveAt >= r.xlsxAt) return r;
      return server('saveXlsx', abToB64(buf), xlsxName(r),
        {number: r.number, city: r.fields.city, point: r.fields.point, route: r.route})
        .then(function (res) {
          if (!res || !res.ok) throw new Error(res && res.error || 'upload');
          r.driveId = res.id;
          r.driveUrl = res.url;
          r.downloadUrl = res.downloadUrl;
          r.driveAt = Date.now();
          saveNow();
          return r;
        });
    });
  }

  function download() {
    var r = S.cur;
    busy(t('building'));
    ensureXlsx(r).then(function (buf) {
      busy(null);
      // На iPhone, особенно в приложении с экрана «Домой», ссылка-скачивание
      // открывает файл без пути назад. Меню «Поделиться» умеет «Сохранить
      // в Файлы» — его и показываем.
      if (IS_IOS && canShareFile(r)) {
        saveViaShare(r, true);
        return;
      }
      var url = URL.createObjectURL(new Blob([buf], {type: XLSX_MIME}));
      var a = document.createElement('a');
      a.href = url;
      a.download = xlsxName(r);
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      S.lastDl = true;
      render();
    }).catch(function (e) {
      busy(null);
      toast(e.message || String(e));
    });
  }

  function driveDownload() {
    var r = S.cur;
    busy(t('uploading'));
    ensureUploaded(r).then(function () {
      busy(null);
      modal('<h2>' + esc(r.number) + '</h2>' +
        '<a class="btn primary block" target="_blank" rel="noopener" href="' + esc(r.downloadUrl) + '">' + esc(t('download')) + '</a>' +
        '<a class="btn block" target="_blank" rel="noopener" href="' + esc(r.driveUrl) + '">' + esc(t('driveLink')) + '</a>' +
        '<button class="btn ghost block" data-act="modal-close">' + esc(t('close')) + '</button>');
    }).catch(function (e) {
      busy(null);
      toast(e.message || t('errNet'));
    });
  }

  function shareText(r, withLink) {
    var f = r.fields;
    var lines = [
      'Заявка ' + r.number + ' · ' + routeName(r.route, RU),
      [f.city, f.point].filter(Boolean).join(', '),
      f.title || f.problem,
      'Срочность: ' + RU['u_' + (f.urgency || 'normal')],
      'Подал: ' + [r.author.name, r.author.phone].filter(Boolean).join(', ')
    ];
    if (withLink && r.driveUrl) lines.push('Файл: ' + r.driveUrl);
    return lines.filter(Boolean).join('\n');
  }

  function canShareFile(r) {
    if (!r.xlsx || !navigator.canShare || !window.File) return false;
    try {
      return navigator.canShare({files: [new File([r.xlsx], xlsxName(r), {type: XLSX_MIME})]});
    } catch (e) { return false; }
  }

  function markSent(r) {
    if (r.status !== 'sent') {
      r.status = 'sent';
      r.sentAt = Date.now();
      saveNow();
    }
  }

  function share() {
    var r = S.cur;
    busy(t('uploading'));
    var uploaded = ensureUploaded(r).then(function () { return true; }).catch(function (e) {
      console.warn('upload', e);
      return false;
    });
    uploaded.then(function (ok) {
      busy(null);
      var text = shareText(r, ok);
      var h = '<h2>' + esc(t('shareTitle')) + '</h2>';
      if (!ok) h += '<div class="note warn">' + esc(t('noDrive')) + '</div>';
      if (canShareFile(r)) h += '<button class="btn primary block share-app" data-act="share-file">' + esc(t('shareFile')) + '</button>';
      h += '<a class="btn block share-app" data-act="sent" target="_blank" rel="noopener" href="https://wa.me/?text=' +
        encodeURIComponent(text) + '">🟢 WhatsApp</a>';
      if (ok) {
        h += '<a class="btn block share-app" data-act="sent" target="_blank" rel="noopener" href="https://t.me/share/url?url=' +
          encodeURIComponent(r.driveUrl) + '&text=' + encodeURIComponent(shareText(r, false)) + '">🔵 Telegram</a>';
      }
      h += '<button class="btn block share-app" data-act="copy">' + esc(t('copyLink')) + '</button>';
      if (ok) h += '<a class="btn block share-app" target="_blank" rel="noopener" href="' + esc(r.driveUrl) + '">' + esc(t('driveLink')) + '</a>';
      h += '<button class="btn ghost block" data-act="modal-close">' + esc(t('close')) + '</button>';
      modal(h);
    });
  }

  // first = true: вызов прямо из нажатия «Скачать». Если браузер счёл, что
  // нажатие уже «остыло» (пока собирался файл), просим нажать ещё раз.
  function saveViaShare(r, first) {
    var file = new File([r.xlsx], xlsxName(r), {type: XLSX_MIME});
    navigator.share({files: [file]}).then(function () { modal(null); }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      if (first && e && e.name === 'NotAllowedError') {
        modal('<h2>' + esc(r.number) + '</h2>' +
          '<button class="btn primary block" data-act="save-file">' + esc(t('saveFile')) + '</button>' +
          '<button class="btn ghost block" data-act="modal-close">' + esc(t('close')) + '</button>');
        return;
      }
      console.warn('share', e);
      S.lastDl = true;
      render();
    });
  }

  function shareFile() {
    var r = S.cur;
    var file = new File([r.xlsx], xlsxName(r), {type: XLSX_MIME});
    navigator.share({files: [file], title: 'Заявка ' + r.number, text: shareText(r, false)})
      .then(function () { markSent(r); modal(null); render(); })
      .catch(function (e) {
        if (e && e.name === 'AbortError') return;
        console.warn('share', e);
        toast('⚠️ ' + (e && e.message || e));
      });
  }

  function copyText(text) {
    var done = function () { toast(t('copied')); };
    var legacy = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* остаётся выделенным */ }
      ta.remove();
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, legacy);
    } else {
      legacy();
    }
  }

  // -------------------------------------------------------------------------
  // События
  // -------------------------------------------------------------------------
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var r = S.cur;
    switch (act) {
      case 'lang':
        S.lang = el.getAttribute('data-l');
        lsSet('zt_lang', S.lang);
        document.documentElement.lang = S.lang;
        render();
        break;
      case 'home': goHome(); break;
      case 'new': newRequest(); break;
      case 'list': refreshList().then(function () { S.screen = 'list'; render(); }); break;
      case 'open': openRequest(el.getAttribute('data-id')); break;
      case 'profile': S.screen = 'profile'; render(); break;
      case 'profile-save': saveProfile(); break;
      case 'prev':
        if (r.step === 0) goHome(); else goStep(r.step - 1);
        break;
      case 'next': next(); break;
      case 'go': goStep(Number(el.getAttribute('data-s'))); break;
      case 'manual': if (!blocked(r)) goStep(1); break;
      case 'finish':
        saveNow().then(function () { toast(t('saved')); goHome(); });
        break;
      case 'mic': toggleMic(); break;
      case 'say': sendText(); break;
      case 'voice':
        S.voice = !S.voice;
        lsSet('zt_voice', S.voice ? '1' : '0');
        if (!S.voice) stopSpeaking();
        el.textContent = S.voice ? t('voiceOn') : t('voiceOff');
        break;
      case 'photo-del':
        var pid = el.getAttribute('data-id');
        r.photos = r.photos.filter(function (p) { return p.id !== pid; });
        touch();
        render();
        break;
      case 'brand':
        var b = el.getAttribute('data-b');
        var list = r.fields.brands || (r.fields.brands = []);
        var at = list.indexOf(b);
        if (at >= 0) list.splice(at, 1); else list.push(b);
        r.fields.noBrand = false;
        r.touched.brands = true;
        syncChips();
        touch();
        break;
      case 'nobrand':
        r.fields.noBrand = !r.fields.noBrand;
        if (r.fields.noBrand) r.fields.brands = [];
        r.touched.brands = true;
        syncChips();
        touch();
        break;
      case 'urg':
        r.fields.urgency = el.getAttribute('data-u');
        r.touched.urgency = true;
        Array.prototype.forEach.call(el.parentNode.children, function (c) { c.classList.toggle('on', c === el); });
        touch();
        break;
      case 'download': download(); break;
      case 'drive-dl': driveDownload(); break;
      case 'share': share(); break;
      case 'share-file': shareFile(); break;
      case 'save-file': saveViaShare(r, false); break;
      case 'install':
        if (installEvent) {
          installEvent.prompt();
          installEvent = null;
          render();
        }
        break;
      case 'install-hide':
        lsSet('zt_install_hidden', '1');
        render();
        break;
      case 'sent':
        markSent(r);
        setTimeout(function () { modal(null); render(); }, 300);
        break;
      case 'copy':
        copyText(shareText(r, !!r.driveUrl));
        markSent(r);
        break;
      case 'modal-close': modal(null); render(); break;
      case 'ask-yes': modal(null); if (askResolve) askResolve(true); askResolve = null; break;
      case 'ask-no': modal(null); if (askResolve) askResolve(false); askResolve = null; break;
      case 'del':
        ask(t('delConfirm')).then(function (ok) {
          if (!ok) return;
          dbDel('requests', r.id).then(function () { S.cur = null; goHome(); });
        });
        break;
      case 'clear':
        ask(t('clearConfirm'), t('clearAll')).then(function (ok) {
          if (!ok) return;
          dbClear('requests').then(function () {
            dropUrls();
            return refreshList();
          }).then(render);
        });
        break;
    }
  }

  function syncChips() {
    var f = S.cur.fields;
    var box = document.getElementById('brands');
    if (!box) return;
    box.classList.remove('bad');
    Array.prototype.forEach.call(box.children, function (c) {
      var b = c.getAttribute('data-b');
      c.classList.toggle('on', b ? (f.brands || []).indexOf(b) >= 0 : !!f.noBrand);
    });
  }

  function onInput(e) {
    var el = e.target;
    var r = S.cur;
    if (!r) return;
    var f = el.getAttribute('data-f');
    var a = el.getAttribute('data-a');
    if (f) {
      r.fields[f] = el.value;
      r.touched[f] = true;
      el.classList.remove('bad');
      touch();
    } else if (a) {
      r.author[a] = el.value;
      touch();
    }
  }

  function onChange(e) {
    var el = e.target;
    var kind = el.getAttribute('data-change');
    if (kind === 'photo' && el.files && el.files.length) {
      addPhotos(el.files);
      el.value = '';
    } else if (kind === 'audio' && el.files && el.files[0]) {
      handleAudio(el.files[0]);
      el.value = '';
    } else if (el.getAttribute('data-f')) {
      onInput(e);
    }
  }

  function onKey(e) {
    if (e.key === 'Enter' && e.target.id === 'say') {
      e.preventDefault();
      sendText();
    }
  }

  function saveProfile() {
    var name = document.getElementById('p-name').value.trim();
    if (!name) {
      document.getElementById('p-name').classList.add('bad');
      toast(t('required'));
      return;
    }
    S.profile = {
      k: 'profile', name: name,
      phone: document.getElementById('p-phone').value.trim(),
      city: document.getElementById('p-city').value
    };
    dbPut('meta', S.profile).then(function () {
      if (S.afterProfile === 'new') { S.afterProfile = null; newRequest(); return; }
      S.screen = 'home';
      render();
    });
  }

  // -------------------------------------------------------------------------
  // Старт
  // -------------------------------------------------------------------------
  function start() {
    app = document.getElementById('app');
    var saved = lsGet('zt_lang');
    S.lang = saved === 'kk' || saved === 'ru' ? saved
      : (/^kk/i.test(navigator.language || '') ? 'kk' : 'ru');
    document.documentElement.lang = S.lang;
    S.voice = lsGet('zt_voice') !== '0';

    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    if (window.speechSynthesis) try { speechSynthesis.getVoices(); } catch (e) { /* прогрев списка голосов */ }

    if (!IN_GAS) {
      // Приложение на телефоне: офлайн-оболочка и кнопка «Установить» (Android).
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); });
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        installEvent = e;
        if (S.screen === 'home') render();
      });
      window.addEventListener('appinstalled', function () {
        installEvent = null;
        if (S.screen === 'home') render();
      });
    }

    server('getConfig').then(function (c) {
      if (!c) return;
      if (c.cities && c.cities.length) CFG.cities = c.cities;
      if (c.kinds && c.kinds.length) CFG.kinds = c.kinds;
      if (c.brands && c.brands.length) CFG.brands = c.brands;
      if (S.aiReady !== !!c.aiReady) {
        S.aiReady = !!c.aiReady;
        if (S.screen === 'wizard' && S.cur && S.cur.step === 0) render();
      }
    }).catch(function (e) { console.warn('getConfig', e); });

    idbOpen()
      .then(function () { return dbGet('meta', 'profile'); })
      .then(function (p) { S.profile = p; return refreshList(); })
      .catch(function (e) { console.warn('start', e); })
      .then(function () {
        S.screen = S.profile ? 'home' : 'profile';
        render();
      });
  }

  // Для проверки из консоли и тестов.
  window.__zt = {S: S, buildXlsx: buildXlsx, xlsxName: xlsxName, handleAudio: handleAudio};

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
</html>
